name: Findex checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    if: "!contains(github.event.head_commit.message, '[sign tested v1.0]')"
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  android:
    if: "!contains(github.event.head_commit.message, '[sign tested v1.0]')"
    name: Android APKs, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Use the runner's Android SDK
        shell: bash
        run: |
          set -o pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' > "$RUNNER_TEMP/sdk-setup.log" 2>&1; then
              cat "$RUNNER_TEMP/sdk-setup.log"
              python3 - "$RUNNER_TEMP/sdk-setup.log" <<'PYTHON'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android SDK setup failed::{text}')
          PYTHON
              exit 1
            fi
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - run: npm ci
      - run: npm run android:sync
      - name: Build both APK variants and verify native code
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease --stacktrace --console=plain > "$RUNNER_TEMP/android-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/android-build.log"
          if [[ "$result" != 0 ]]; then
            python3 - "$RUNNER_TEMP/android-build.log" <<'PYTHON'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          important = [line for line in lines if line.startswith(('e: ', 'error: ', 'FAILURE:')) or (line.startswith('> ') and not line.startswith(('> Task', '> Configure'))) or 'What went wrong' in line or 'Could not' in line or 'Error:' in line]
          text = '\n'.join(important or lines[-60:])[:24000]
          for offset in range(0, len(text), 3000):
              chunk = text[offset:offset + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native build failed (part {offset // 3000 + 1})::{chunk}')
          PYTHON
          fi
          exit "$result"
        working-directory: android
      - name: Verify release version and ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/apk-badging.txt"
          head -1 "$RUNNER_TEMP/apk-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: findex-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/schemas/
  publish:
    name: Sign APK and prepare v1.0 release
    needs: [workspace, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0caa2-findex' && contains(github.event.head_commit.message, '[publish v1.0]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          name: findex-apks
          path: downloaded-apks
      - name: Sign and verify APK, encrypt signing backup, create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prepare-release.sh

  sign_verified:
    name: Sign the already verified v1.0 APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0caa2-findex' && contains(github.event.head_commit.message, '[sign tested v1.0]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '35814417633'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify prior checks and unchanged application source
        shell: bash
        run: |
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq '.head_sha')
          source_branch=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq '.head_branch')
          test "$source_branch" = 'arena/01a0caa2-findex'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs" > "$RUNNER_TEMP/verified-jobs.json"
          python3 - "$RUNNER_TEMP/verified-jobs.json" <<'PYTHON'
          import json, sys
          jobs = {job['name']: job['conclusion'] for job in json.load(open(sys.argv[1]))['jobs']}
          required = ['Web build and tests', 'Android APKs, unit tests, and lint']
          assert all(jobs.get(name) == 'success' for name in required), jobs
          PYTHON
          git diff --exit-code "$source_sha" "$GITHUB_SHA" -- android src public package.json package-lock.json capacitor.config.ts vite.config.ts 'tsconfig*.json'
          echo "APK source and native/web verification matched $source_sha."
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: '35814417633'
          name: findex-apks
          path: downloaded-apks
      - name: Sign verified APK and report actionable diagnostics
        shell: bash
        run: |
          set +e
          scripts/prepare-release.sh > "$RUNNER_TEMP/release-step.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/release-step.log"
          if [[ "$result" != 0 ]]; then
            python3 - "$RUNNER_TEMP/release-step.log" <<'PYTHON'
          import pathlib, sys
          lines = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if not line.startswith('::notice')]
          text = '\n'.join(lines[-45:])[-12000:]
          for offset in range(0, len(text), 3000):
              chunk = text[offset:offset + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Release preparation failed (part {offset // 3000 + 1})::{chunk}')
          PYTHON
          fi
          exit "$result"
