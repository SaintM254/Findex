name: Findex checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  android:
    name: Android APKs, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Use the runner's Android SDK
        shell: bash
        run: |
          set -o pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' > "$RUNNER_TEMP/sdk-setup.log" 2>&1; then
              cat "$RUNNER_TEMP/sdk-setup.log"
              python3 - "$RUNNER_TEMP/sdk-setup.log" <<'PYTHON'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android SDK setup failed::{text}')
          PYTHON
              exit 1
            fi
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - run: npm ci
      - run: npm run android:sync
      - name: Build both APK variants and verify native code
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease --stacktrace --console=plain > "$RUNNER_TEMP/android-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/android-build.log"
          if [[ "$result" != 0 ]]; then
            python3 - "$RUNNER_TEMP/android-build.log" <<'PYTHON'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          important = [line for line in lines if line.startswith(('e: ', 'error: ', 'FAILURE:')) or (line.startswith('> ') and not line.startswith(('> Task', '> Configure'))) or 'What went wrong' in line or 'Could not' in line or 'Error:' in line]
          text = '\n'.join(important or lines[-60:])[:24000]
          for offset in range(0, len(text), 3000):
              chunk = text[offset:offset + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native build failed (part {offset // 3000 + 1})::{chunk}')
          PYTHON
          fi
          exit "$result"
        working-directory: android
      - name: Verify release version and ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/apk-badging.txt"
          head -1 "$RUNNER_TEMP/apk-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: findex-1.1-unsigned-and-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/schemas/

  sign-release:
    name: Sign and publish the authorized release
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0caa2-findex' && (contains(github.event.head_commit.message, '[publish release]') || contains(github.event.head_commit.message, '[bootstrap signing]'))
    needs: [workspace, android, device]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FINDEX_RELEASE_KEYSTORE_BASE64: ${{ secrets.FINDEX_RELEASE_KEYSTORE_BASE64 }}
      FINDEX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FINDEX_RELEASE_KEYSTORE_PASSWORD }}
      FINDEX_BOOTSTRAP: ${{ contains(github.event.head_commit.message, '[bootstrap signing]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android build tools
        shell: bash
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' > /dev/null
          fi
      - uses: actions/download-artifact@v5
        with:
          name: findex-1.1-unsigned-and-debug
          path: downloaded-apks
      - name: Sign, verify, and create the draft release
        shell: bash
        run: |
          set +e
          scripts/release-sign.sh downloaded-apks/release/app-release-unsigned.apk release-assets/Findex-1.1.apk > "$RUNNER_TEMP/sign-release.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/sign-release.log"
          if [[ "$result" != 0 ]]; then
            python3 - "$RUNNER_TEMP/sign-release.log" <<'PYTHON'
          import pathlib, sys
          lines = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if not line.startswith('::notice')]
          text = '\n'.join(lines[-45:])[-12000:]
          for offset in range(0, len(text), 3000):
              chunk = text[offset:offset + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Release signing failed (part {offset // 3000 + 1})::{chunk}')
          PYTHON
          fi
          exit "$result"

    name: Android browsing and navigation smoke tests
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          name: findex-1.1-unsigned-and-debug
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Android directory browsing with a large index
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r apk/debug/app-debug.apk
            adb install -r apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r app.findex.files.test/androidx.test.runner.AndroidJUnitRunner > android-device-tests.txt
            cat android-device-tests.txt
            python3 scripts/check-instrumentation.py android-device-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-results
          path: android-device-tests.txt
