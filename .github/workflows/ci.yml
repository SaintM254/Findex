name: Findex checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  android:
    name: Android APKs, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the runner's Android SDK
        shell: bash
        run: |
          set -o pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' > "$RUNNER_TEMP/sdk-setup.log" 2>&1; then
              cat "$RUNNER_TEMP/sdk-setup.log"
              python3 - "$RUNNER_TEMP/sdk-setup.log" <<'PYTHON'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android SDK setup failed::{text}')
          PYTHON
              exit 1
            fi
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - run: npm ci
      - run: npm run android:sync
      - name: Build both APK variants and verify native code
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease --stacktrace --console=plain > "$RUNNER_TEMP/android-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/android-build.log"
          if [[ "$result" != 0 ]]; then
            python3 - "$RUNNER_TEMP/android-build.log" <<'PYTHON'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          important = [line for line in lines if line.startswith(('e: ', 'error: ', 'FAILURE:', '> ')) or 'What went wrong' in line or 'Could not' in line or 'Error:' in line]
          text = '\n'.join(important or lines[-80:])[:18000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Native build failed::{text}')
          PYTHON
          fi
          exit "$result"
        working-directory: android
      - name: Verify release version and ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk | head -1
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: findex-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Package public tools for private, local release signing
        run: |
          mkdir -p "$RUNNER_TEMP/findex-signing-tools"
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.logging,java.xml,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.zipfs,jdk.jartool --strip-debug --no-header-files --no-man-pages --compress=2 --output "$RUNNER_TEMP/findex-signing-runtime"
          tar -czf "$RUNNER_TEMP/findex-signing-tools/runtime.tar.gz" -C "$RUNNER_TEMP" findex-signing-runtime
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$RUNNER_TEMP/findex-signing-tools/"
      - uses: actions/upload-artifact@v4
        with:
          name: signing-tools
          path: ${{ runner.temp }}/findex-signing-tools/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/schemas/
